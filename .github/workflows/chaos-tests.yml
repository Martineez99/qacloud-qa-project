name: Crypto Chaos Tests

on:
  push:
    branches: [develop, main]
    paths:
      - 'src/api/crypto/**'
      - 'src/e2e/crypto/**'
      - 'src/utils/crypto-ws-client.ts'
  pull_request:
    paths:
      - 'src/api/crypto/**'
      - 'src/e2e/crypto/**'
  workflow_dispatch: {}

jobs:
  crypto-chaos-tests:
    name: Crypto Chaos Tests
    runs-on: ubuntu-latest
    env:
      QACLOUD_BASE_URL: ${{ secrets.QACLOUD_BASE_URL }}
      QACLOUD_API_KEY:  ${{ secrets.QACLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Crypto chaos suite
        run: npm run test:chaos:crypto
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-chaos-allure-results
          path: reports/allure-results/
          retention-days: 30