sonar.projectKey=Martineez99_qacloud-qa-project
sonar.organization=martineez99

sonar.projectName=QA Cloud - Test Automation Suite
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

sonar.exclusions=node_modules/**,dist/**,reports/**,.auth/**,src/performance/**

# El proyecto no genera coverage tradicional (Istanbul/nyc): son tests
# E2E/API contra un servidor real, no unit tests instrumentados.
# Excluimos todo de la métrica de cobertura para que el Quality Gate
# ("Sonar way", fijo en el plan Free) no falle por una condición que
# no tiene sentido en un proyecto de automatización de tests.
sonar.coverage.exclusions=**/*

sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8